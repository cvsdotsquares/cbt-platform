name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Repo Settings → Environments → production → Required reviewers
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: |
            set -euo pipefail
            export CBT_APP_ROOT="${{ secrets.DEPLOY_PATH_PRODUCTION }}"
            cd "$CBT_APP_ROOT"
            bash scripts/deploy/remote-deploy.sh production "${{ github.sha }}"

      - name: Smoke check (public API)
        continue-on-error: true
        env:
          URL: ${{ vars.PROD_API_HEALTH_URL }}
        run: |
          if [ -z "${URL:-}" ]; then
            echo "Skipping smoke check (set repo variable PROD_API_HEALTH_URL to enable)"
            exit 0
          fi
          for i in $(seq 1 10); do
            if curl -sf "$URL" >/dev/null; then
              echo "OK: $URL"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke check did not pass yet: $URL"
          exit 1
