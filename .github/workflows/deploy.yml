name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: |
            set -euo pipefail
            export CBT_APP_ROOT="${{ secrets.DEPLOY_PATH }}"
            cd "$CBT_APP_ROOT"
            bash scripts/deploy/remote-deploy.sh "${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Smoke check (public API)
        continue-on-error: true
        run: |
          URL="${{ vars.API_HEALTH_URL }}"
          if [ -z "${URL}" ]; then URL="${{ vars.PROD_API_HEALTH_URL }}"; fi
          if [ -z "${URL:-}" ]; then
            echo "Skipping smoke check (set repo variable API_HEALTH_URL to enable)"
            exit 0
          fi
          for i in $(seq 1 10); do
            if curl -sf "$URL" >/dev/null; then
              echo "OK: $URL"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke check did not pass yet: $URL"
          exit 1
